name: Legacy ARC Android compile check

on:
  push:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/legacy-arc-android.yml"
  pull_request:
    paths:
      - "app/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle/**"
      - ".github/workflows/legacy-arc-android.yml"

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        shell: bash
        run: sdkmanager --install "platforms;android-34" "build-tools;34.0.0"
      - name: Compile legacy Android Kotlin without APK release
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugKotlin --no-daemon --max-workers=1
