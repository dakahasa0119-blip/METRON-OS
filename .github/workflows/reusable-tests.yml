name: Reusable toolkit tests

on:
  push:
    paths:
      - "reusable/**"
      - ".github/workflows/reusable-tests.yml"
  pull_request:
    paths:
      - "reusable/**"
      - ".github/workflows/reusable-tests.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require desktop Chromium for integration test (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: Require desktop Chromium for integration test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $browsers = @(
            "$env:ProgramFiles\Google\Chrome\Application\chrome.exe",
            "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          )
          if (-not ($browsers | Where-Object { Test-Path $_ })) {
            throw "No supported Chromium browser is available on the runner"
          }
      - name: Run unit, historical-source and Chromium integration tests
        run: node --test reusable/tests/*.test.mjs
      - name: Validate independently distributable packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          root=$(mktemp -d)
          for pkg in arc-dom baku-dna gateway-jobs mothership; do
            echo "Packing $pkg"
            npm pack --pack-destination "$root" --silent "./reusable/$pkg"
          done
          npm install --prefix "$root" --ignore-scripts --no-audit --no-fund "$root"/*.tgz
          cat > "$root/consumer.mjs" <<'EOF'
          import { findDeep } from "metron-reference-arc-dom";
          import { extractCards } from "metron-reference-baku-dna";
          import { auditRepairOutcomes } from "metron-reference-baku-dna/repair-audit";
          import { JobQueue } from "metron-reference-gateway-jobs";
          import { createChunkedArtifact, verifyChunkedArtifact } from "metron-reference-gateway-jobs/chunk-envelope";
          import { adviseGatewayRoute } from "metron-reference-gateway-jobs/mediation-advice";
          import { preflightRepairRequest } from "metron-reference-gateway-jobs/repair-preflight";
          import { snapshotDigest, reviewRepairSnapshots } from "metron-reference-gateway-jobs/snapshot-diff";
          import { readTextWorktree } from "metron-reference-gateway-jobs/worktree-reader";
          import { reviewRepairWorktrees, verifyWorktreeReadback } from "metron-reference-gateway-jobs/worktree-review";
          import { assessRepairEvidence } from "metron-reference-gateway-jobs/repair-evidence";
          import { newPatch } from "metron-reference-mothership-workflow";
          if ([findDeep, extractCards, auditRepairOutcomes, JobQueue, createChunkedArtifact, verifyChunkedArtifact, adviseGatewayRoute, preflightRepairRequest, snapshotDigest, reviewRepairSnapshots, readTextWorktree, reviewRepairWorktrees, verifyWorktreeReadback, assessRepairEvidence, newPatch].some(x => typeof x !== "function")) {
            throw new Error("package entrypoint could not be imported");
          }
          console.log("FOUR_PACKAGES_IMPORT_PASS");
          EOF
          node "$root/consumer.mjs"
